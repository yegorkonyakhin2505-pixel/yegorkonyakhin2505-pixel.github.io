# Security headers. nginx does not inherit add_header into a location that sets its
# own add_header, so this file is included in the server block AND in every location.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# Report-Only first: the Next.js static export needs inline scripts/styles. Promote to
# Content-Security-Policy once the browser console shows no violations.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://wa.me; object-src 'none'" always;
