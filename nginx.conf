server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Brand moved from amplifymarketing.ae to multify.ae (Oct 2026): permanent redirect of the
    # old hostnames and of www. Unknown hosts (health checks, container IP) are still served.
    if ($host ~* ^(www\.)?amplifymarketing\.ae$) {
        return 301 https://multify.ae$request_uri;
    }
    if ($host = "www.multify.ae") {
        return 301 https://multify.ae$request_uri;
    }

    # nginx sits behind Traefik (TLS terminated there), so redirects must not rebuild an
    # absolute http:// URL; relative Location headers resolve against https://multify.ae.
    absolute_redirect off;

    # One URL per page: the static export emits both `pricing.html` and a `pricing/` directory,
    # so a trailing slash used to hit the directory and return 403. Redirect it to the canonical.
    # `$request_uri` is the original request, untouched by nginx's internal `index` rewrite,
    # so `/` itself (served as index.html internally) is never redirected.
    if ($request_uri ~ ^(/.+)/$) {
        return 301 $1;
    }
    # The homepage is `/`, never `/index.html` (checked on the original request only).
    if ($request_uri ~ ^/index\.html(\?|$)) {
        return 301 /;
    }

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Hashed Next build assets: immutable, cache for a year
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Videos, images, fonts: not fingerprinted, cache 30 days and revalidate in the background
    location ~* \.(mp4|webm|jpg|jpeg|png|webp|avif|gif|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # Web app manifest: correct MIME (not in the default mime.types) and a day of cache
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Text files the search/AI crawlers read: short cache
    location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Next.js RSC payloads: never index
    location ~* ^/(__next\..*|index)\.txt$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }

    # Internal error pages are not directly addressable
    location ~* ^/(_not-found|404)\.html$ {
        internal;
    }

    # HTML pages: always revalidate. Unknown URLs must be a real 404 (status code),
    # never the 404 page served with HTTP 200.
    # The quiz preview URL (29 Oct 2026) lives on /pricing now.
    location = /find-your-price { return 301 /pricing; }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
